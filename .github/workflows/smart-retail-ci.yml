
name: Smart Retail CI

on:
  push:
    branches: [main]
    paths:
      - 'CI_CD/retail-ace-main (3)/retail-ace-main/**'

  pull_request:
    branches: [main]
    paths:
      - 'CI_CD/retail-ace-main (3)/retail-ace-main/**'

  workflow_dispatch:

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: './CI_CD/retail-ace-main (3)/retail-ace-main'

    steps:
      - name: Checkout repository
  uses: actions/checkout@v4
  with:
    submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'CI_CD/retail-ace-main (3)/retail-ace-main/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
